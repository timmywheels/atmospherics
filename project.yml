name: Atmospherics
options:
  bundleIdPrefix: com.timwheeler
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  # Updates for the Mac app downloaded from GitHub (not the App Store).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Atmospherics:
    type: application
    platform: iOS
    sources: [Atmospherics, Shared]
    dependencies:
      - target: AtmosphericsWidget
    entitlements:
      path: Atmospherics/Atmospherics.entitlements
      properties:
        com.apple.security.application-groups: [group.com.timwheeler.atmospherics]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timwheeler.atmospherics
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        DEVELOPMENT_TEAM: S3RY6Q3EW2
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "21"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Apple's on-device model (Vibe.swift) is iOS 26 and later; weak, so earlier iPhones still open the app.
        OTHER_LDFLAGS: $(inherited) -weak_framework FoundationModels
    info:
      path: Atmospherics/Info.plist
      properties:
        CFBundleDisplayName: Atmospherics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [InstrumentSerif-Regular.ttf]
        NSLocationWhenInUseUsageDescription: Atmospherics uses your approximate location to match its sounds to the weather outside.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
  AtmosphericsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timwheeler.atmospherics.widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "21"
        DEVELOPMENT_TEAM: S3RY6Q3EW2
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.timwheeler.atmospherics]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Atmospherics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AtmosphericsMac:
    # The Mac app: the same sounds, places and weather, in a window and the menu bar.
    # Same bundle ID as the iPhone app, so it can be one App Store purchase.
    type: application
    platform: macOS
    sources:
      - path: Atmospherics
        excludes:
          - AtmosphericsApp.swift
          - ContentView.swift
          - Info.plist
          - Atmospherics.entitlements
          - Assets.xcassets
      - path: Shared
        excludes:
          - SoundscapeActivity.swift
      - path: Mac
        excludes:
          - Info.plist
          - Atmospherics.entitlements
    dependencies:
      - package: Sparkle
    entitlements:
      path: Mac/Atmospherics.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        # Sparkle's installer runs outside the sandbox and talks to the app over these.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_NAME: Atmospherics
        PRODUCT_BUNDLE_IDENTIFIER: com.timwheeler.atmospherics
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.1.8"
        CURRENT_PROJECT_VERSION: "10"
        DEVELOPMENT_TEAM: S3RY6Q3EW2
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Apple's on-device model (Vibe.swift) is macOS 26 and later; weak, so earlier Macs still open the app.
        OTHER_LDFLAGS: $(inherited) -weak_framework FoundationModels
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Atmospherics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ATSApplicationFontsPath: .
        NSLocationUsageDescription: Atmospherics uses your approximate location to match its sounds to the weather outside.
        NSLocationWhenInUseUsageDescription: Atmospherics uses your approximate location to match its sounds to the weather outside.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 Timothy Wheeler
        # Updates (Sparkle): the feed is attached to the latest GitHub release, and each update is
        # signed with the key in the login keychain under "atmospherics" (scripts/package-mac.sh).
        SUFeedURL: https://github.com/timmywheels/atmospherics/releases/latest/download/appcast.xml
        SUPublicEDKey: iWHqyDVEyfgxdKxhKJQ6OmS+S7TlpIeNigVouyb81mM=
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: true

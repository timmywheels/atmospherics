name: Atmospherics
options:
  bundleIdPrefix: com.timwheeler
  deploymentTarget:
    iOS: "17.0"
targets:
  Atmospherics:
    type: application
    platform: iOS
    sources: [Atmospherics]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timwheeler.atmospherics
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        DEVELOPMENT_TEAM: S3RY6Q3EW2
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Atmospherics/Info.plist
      properties:
        CFBundleDisplayName: Atmospherics
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: Atmospherics uses your approximate location to match its sounds to the weather outside.
        ITSAppUsesNonExemptEncryption: false
